<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>

<body>

    <!-- Titre -->
    <h1 class="text-center">Météo</h1>

    <!-- Ville / Temperature -->
    <div>Ville : <span id="ville"></span></div>

    <div id="temperature">
        <span id="temperature_label">
            xx.x
        </span> °C
    </div>
    <!-- conditions -->
    <div id="condition " class="general">
        Condition
    </div>

    <div class="change_general">
        <label for="select_ville">Choisir une ville :</label>
        <select id="select_ville">
            <option value="">--Sélectionnez--</option>
            <option value="Paris">Paris</option>
            <option value="Lyon">Lyon</option>
            <option value="Perpignan">Perpignan</option>
        </select>
    </div>
    <script src="script.js"></script>
</body>

</html>
